# Configuração baked-in do Event Gateway.
#
# Este arquivo é embarcado no binário via //go:embed em embed.go e usado
# quando $EVENT_GATEWAY_CONFIG não está definido.
#
# Hostnames abaixo (gateway-db, kafka) são os nomes internos da rede
# docker-compose. Para que este mesmo YAML funcione tanto DENTRO dos
# containers quanto DO HOST, o host precisa resolver esses nomes para
# 127.0.0.1 — as portas 5432, 9092 e 8081 já estão publicadas pelo compose.
#
# Adicione UMA vez ao /etc/hosts local:
#   sudo sh -c 'echo "127.0.0.1 gateway-db kafka schema-registry" >> /etc/hosts'
#
# Depois `make migrations` do host e o container gateway-migrations do
# compose consomem o mesmo binário sem override por env.
# Overrides por env continuam sendo respeitados (prefixo GATEWAY_).

server:
  port: 8080
  timeouts:
    read_header: 2s
    read:        5s
    write:       10s
    idle:        60s

database:
  dsn: "postgres://gateway:secret@gateway-db:5432/gateway_db?sslmode=disable"
  max_open_conns:    20
  max_idle_conns:    5
  conn_max_lifetime: 30m

kafka:
  brokers:
    - "kafka:9092"
  producer:
    acks:          "all"
    retries:       5
    retry_backoff: 100ms
    compression:   "snappy"

relay:
  poll_interval: 500ms
  batch_size:    100
  # Seis tentativas no total: a entrega inicial e cinco retries.
  max_retries:   6
  initial_backoff: 1s
  max_backoff:     30s

# Consumo do Kafka e dispatch HTTP aos subscribers.
dispatcher:
  worker:
    batch_size:    100
    poll_interval: 500ms
    # Seis tentativas no total: a entrega inicial e cinco retries (1, 2, 4, 8, 16s).
    max_retries:   6
    backoff:
      base:        1s
  consumer:
    group_id:        "gateway-dispatcher"
    session_timeout: 10s
  http:
    per_attempt_timeout: 5s

# Assinaturas estáticas: event_type → serviços consumidores.
subscriptions:
  - event_type: "order.created"
    consumers:
      - id:  "payment-service"
        url: "http://payment-service:8082/dispatch"
      - id:  "inventory-service"
        url: "http://inventory-service:8083/dispatch"
  - event_type: "order.cancelled"
    consumers:
      - id:  "notification-service"
        url: "http://notification-service:8085/dispatch"
  - event_type: "payment.processed"
    consumers:
      - id:  "fulfillment-service"
        url: "http://fulfillment-service:8084/dispatch"
  - event_type: "payment.failed"
    consumers:
      - id:  "order-service"
        url: "http://order-service:8081/dispatch"
      - id:  "inventory-service"
        url: "http://inventory-service:8083/dispatch"
  - event_type: "payment.refunded"
    consumers:
      - id:  "notification-service"
        url: "http://notification-service:8085/dispatch"
  - event_type: "stock.reserved"
    consumers:
      - id:  "fulfillment-service"
        url: "http://fulfillment-service:8084/dispatch"
  - event_type: "stock.failed"
    consumers:
      - id:  "order-service"
        url: "http://order-service:8081/dispatch"
      - id:  "payment-service"
        url: "http://payment-service:8082/dispatch"
  - event_type: "stock.released"
    consumers:
      - id:  "notification-service"
        url: "http://notification-service:8085/dispatch"
  - event_type: "order.fulfilled"
    consumers:
      - id:  "notification-service"
        url: "http://notification-service:8085/dispatch"
      - id:  "order-service"
        url: "http://order-service:8081/dispatch"

schema_registry:
  endpoint: http://schema-registry:8081
  group_name: tcc-poc
  format: JSON
  compatibility: FULL_TRANSITIVE
  request_timeout: 2s
  cache:
    enabled: true
    ttl:     5m

observability:
  metrics:
    enabled: true
    port:    9090
  log:
    level:  "info"
    format: "json"

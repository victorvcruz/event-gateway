server:
  port: 8080
  timeouts:
    read_header: 2s
    read: 5s
    write: 10s
    idle: 60s

database:
  dsn: "postgres://gateway:secret@gateway-db:5432/gateway_db?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m

kafka:
  brokers: ["kafka:9092"]
  producer:
    acks: all
    retries: 5
    retry_backoff: 100ms
    compression: snappy

relay:
  poll_interval: 500ms
  batch_size: 100
  max_retries: 6
  initial_backoff: 1s
  max_backoff: 30s

dispatcher:
  worker:
    batch_size: 100
    poll_interval: 500ms
    max_retries: 6
    backoff:
      base: 1s
  consumer:
    group_id: gateway-dispatcher-chaos
    session_timeout: 10s
  http:
    per_attempt_timeout: 5s

subscriptions:
  - event_type: order.created
    consumers:
      - {id: payment-service, url: "http://toxiproxy:18082/dispatch"}
      - {id: inventory-service, url: "http://toxiproxy:18083/dispatch"}
  - event_type: order.cancelled
    consumers:
      - {id: notification-service, url: "http://toxiproxy:18085/dispatch"}
  - event_type: payment.processed
    consumers:
      - {id: fulfillment-service, url: "http://toxiproxy:18084/dispatch"}
  - event_type: payment.failed
    consumers:
      - {id: order-service, url: "http://toxiproxy:18081/dispatch"}
      - {id: inventory-service, url: "http://toxiproxy:18083/dispatch"}
  - event_type: payment.refunded
    consumers:
      - {id: notification-service, url: "http://toxiproxy:18085/dispatch"}
  - event_type: stock.reserved
    consumers:
      - {id: fulfillment-service, url: "http://toxiproxy:18084/dispatch"}
  - event_type: stock.failed
    consumers:
      - {id: order-service, url: "http://toxiproxy:18081/dispatch"}
      - {id: payment-service, url: "http://toxiproxy:18082/dispatch"}
  - event_type: stock.released
    consumers:
      - {id: notification-service, url: "http://toxiproxy:18085/dispatch"}
  - event_type: order.fulfilled
    consumers:
      - {id: notification-service, url: "http://toxiproxy:18085/dispatch"}
      - {id: order-service, url: "http://toxiproxy:18081/dispatch"}

schema_registry:
  endpoint: http://schema-registry:8081
  group_name: tcc-poc
  format: JSON
  compatibility: FULL_TRANSITIVE
  request_timeout: 2s
  cache:
    enabled: true
    ttl: 2s

observability:
  metrics:
    enabled: true
    port: 9090
  log:
    level: info
    format: json

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "event-gateway-poc"

scrape_configs:
  # Lado da ingestão: POST /events e métricas do server.
  - job_name: "gateway-server"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-server:9090"]

  # Worker: relay do Kafka, dispatch e consumer.
  # Porta interna do container é 9090; publicada externamente em 9091.
  - job_name: "gateway-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-worker:9090"]

  - job_name: "business-services"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "order-service:9090"
          - "payment-service:8082"
          - "inventory-service:8083"
          - "fulfillment-service:8084"
          - "notification-service:8085"

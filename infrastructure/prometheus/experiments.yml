global:
  scrape_interval: 1s
  evaluation_interval: 1s
  external_labels:
    monitor: "event-gateway-experiments"

scrape_configs:
  - job_name: gateway-server
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-server:9090"]

  - job_name: gateway-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-worker:9090"]

  - job_name: experiment-control
    metrics_path: /metrics
    static_configs:
      - targets: ["experiment-control:8086"]

  - job_name: business-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - "order-service:9090"
          - "payment-service:8082"
          - "inventory-service:8083"
          - "fulfillment-service:8084"
          - "notification-service:8085"


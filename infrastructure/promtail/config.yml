server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Descobre containers via Docker socket e ingere logs em stream.
  # Cada container vira uma stream Loki com labels {container, image, compose_service}.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: logstream
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
    pipeline_stages:
      # Zap (gateway-server / gateway-worker) loga em JSON. Extraímos level
      # como label leve para filtrar no Explore ({compose_service="gateway-worker",level="warn"}).
      - json:
          expressions:
            level: level
            msg: msg
            caller: caller
      - labels:
          level:
